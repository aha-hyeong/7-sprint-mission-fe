<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 회원가입</title>
    <link rel="stylesheet" href="./style/sign.css" />
    <link rel="icon" href="./images/home/panda-face.svg" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>
          <a href="./index.html" class="go-home">
            <img
              class="panda-face"
              src="./images/home/panda-face.svg"
              alt="로고"
            />
            판다마켓
          </a>
        </h1>
      </header>

      <form action="/signup" method="post" class="sign-form">
        <div class="email">
          <label for="user-email" class="user-email">이메일</label>
          <input
            class="email-input"
            type="email"
            name="user-email"
            placeholder="이메일을 입력해주세요"
          />
        </div>

        <div class="nick-name">
          <label for="user-nick-name" class="user-nick-name">닉네임</label>
          <input
            class="nick-name-input"
            type="text"
            name="user-nick-name"
            placeholder="닉네임을 입력해주세요"
          />
        </div>

        <div class="password">
          <label for="user-password" class="user-password">비밀번호</label>
          <div class="password-eye-set">
            <input
              id="user-password"
              class="password-input"
              type="password"
              name="user-password"
              placeholder="비밀번호를 입력해주세요"
            />
            <i class="fas fa-eye icon" id="togglePassword"></i>
          </div>
        </div>

        <div class="password-check">
          <label for="user-password-check" class="user-password-check"
            >비밀번호 확인</label
          >
          <div class="password-eye-set2">
            <input
              id="user-password-check"
              class="password-input-check"
              type="password"
              name="user-password-check"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
            <i class="fas fa-eye icon" id="togglePasswordCheck"></i>
          </div>
        </div>

        <button type="submit" class="sign-button">회원가입</button>
      </form>
    </div>

    <section class="easy-login">
      <p>간편 로그인하기</p>
      <div class="easy-login-right">
        <a href="http://www.google.com" target="_blank">
          <div class="google">
            <img
              src="./images/login/google.svg"
              alt="구글 로그인"
              class="google-icon"
            />
          </div>
        </a>
        <a href="http://www.kakao.com/page/" target="_blank">
          <div class="kakaoTalk">
            <img src="./images/login/kakaoTalk.svg" alt="카카오 로그인" />
          </div>
        </a>
      </div>
    </section>

    <div class="login-group">
      <p>이미 회원이신가요?</p>
      <a href="./login.html" class="login">로그인</a>
    </div>
    <script src="./script/login.js"></script>
  </body>
</html>
